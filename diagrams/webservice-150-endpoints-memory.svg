<title id="title">約 150 エンドポイントの Web サービス</title>
<desc id="description">Ubuntu Server 24.04 LTS ARM64 上の Rails、FastAPI、Go をそれぞれ30台で運用する代替構成。OSとエージェント、アプリ、負荷時追加メモリ、運用余裕、残容量、および共通のCPU時間と処理時間を仮定したreq/secの計算値を示す。実測値ではなく、言語間の性能差を示すものではない。</desc>
