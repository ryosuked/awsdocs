<text x="1086" y="1276" font-size="13" class="muted" text-anchor="middle">3 つの目安の最小値 / アプリは 1 プロセス</text>
<rect x="32" y="1320" width="1256" height="200" fill="#ffffff" rx="16" stroke="#dbe3ed"/>
<text x="52" y="1347" font-size="17" font-weight="700">req/sec の計算条件 — メモリ容量から処理件数を換算した値ではありません</text>
<text x="52" y="1377" font-size="15">1 台の req/sec ≈ min(CPU 予算 ÷ 1 件の CPU 時間, 同時処理数 ÷ 平均処理時間, DB 接続数 ÷ 接続占有時間)</text>
<text x="52" y="1406" font-size="14" class="muted">CPU 予算：c7g.medium の 1 vCPU の 60% = 0.6 vCPU。残りはホスト処理と余力。CPU 時間は候補実機で測り直します。</text>
<text x="52" y="1435" font-size="14" class="muted">CPU 時間・平均処理時間・DB 接続占有時間は 3 言語で共通の仮定。言語固有の性能差・実測順位は示しません。</text>
<text x="52" y="1464" font-size="14" class="muted">平均処理時間は CPU と I/O 待ちを含む仮値。DB 接続は 1 件につき 1 本。p95 / p99・エラー率・メモリ上限は未検証です。</text>
<text x="52" y="1493" font-size="14" class="muted">30 台は均等分散し、DB 本体・ALB・外部 API に余力がある仮定。障害時の余力は未控除。スレッド数を変えると結果も変わります。</text>
<text x="40" y="1548" font-size="15" class="muted">メモリの前提：ホスト 256 MiB、運用余裕 256 MiB。アプリ常駐分(無負荷時ベース)と負荷時追加分も比較用の仮定です。</text>
<text x="40" y="1577" font-size="15" class="muted">残容量は運用余裕まで差し引いた値。各アプリは 1 プロセスで、管理親プロセスの追加分はありません。</text>
<text x="40" y="1606" font-size="15" class="muted">常駐分や負荷時の追加分が増える場合は 4 GiB の M medium を比較します。必要な CPU と応答時間は別途検証します。</text>
<text x="40" y="1642" font-size="14" class="muted">料金：東京・Linux・オンデマンド・730 時間 / 2026-11-07 の価格データ。EC2 本体以外は含みません。</text>
<rect x="32" y="1672" width="1256" height="158" fill="#edf4ff" rx="16" stroke="#c6d8f7"/>
<text x="52" y="1703" font-size="17" font-weight="700">補足：公開事例を踏まえた設計上の推論</text>
<text x="52" y="1736" font-size="15" class="muted">・メモリ：エンドポイント数より、読み込む機能・キャッシュ・ワーカー数によるアプリ常駐分(無負荷時ベース)を重視する。</text>
<text x="52" y="1766" font-size="15" class="muted">・Rails / FastAPI：ワーカー追加時の常駐メモリまで含めて C 系と M 系を比較し、スレッド数・同時処理数も調整する。</text>
<text x="52" y="1796" font-size="15" class="muted">・req/sec：図の値は設定条件による計算例。特に Rails の値は 3 スレッド設定に依存し、調整後の性能を表さない。</text>
</svg>
